name: build and test

# One standard Intel macOS runner instead of two Apple Silicon runners.
# Manually trigger from Actions > build and test > Run workflow, choosing the
# feature branch. The DEB is uploaded before simulator tests, so failures
# never prevent downloading an experimental build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/.theos-toolchain

jobs:
  build-and-test:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Cheap preflight: prevent removed setting identifiers or malformed plists
      # from wasting a full arm64 + arm64e compilation.
      - name: Validate settings before compilation
        run: python3 scripts/check-prefs-plists.py

      - name: Install dpkg and RootHide signing tools
        run: brew install dpkg ldid-procursus

      # build-payload.sh installs pinned Theos once, in .theos-toolchain.
      # Unsetting THEOS here invokes its own CI bootstrap; the shared env
      # remains set for the later test step on this SAME runner.
      - name: Build RootHide-native tweak (Xcode clang, arm64 + arm64e)
        run: |
          VERSION="$(awk '/^Version:/ { print $2; exit }' control)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          unset THEOS
          tools/build-payload.sh "$VERSION"

      - name: Assemble the .deb
        env:
          GH_REPO: ${{ github.repository }}
          GH_PAGES: ${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: tools/build-deb.sh "dev${{ github.run_number }}"

      - name: Verify RootHide package metadata and payload
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(repo/debs/*.deb)
          test "${#packages[@]}" -eq 1
          for deb in "${packages[@]}"; do
            [[ "$deb" == *_iphoneos-arm64e.deb ]]
            test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64e"
            test "$(dpkg-deb -f "$deb" Package)" = "com.andi.carly"
            dpkg-deb -c "$deb" | grep -F './Library/MobileSubstrate/DynamicLibraries/carLy.dylib'
            dpkg-deb -c "$deb" | grep -F './Library/PreferenceBundles/carLyPrefs.bundle/carLyPrefs'
            if dpkg-deb -c "$deb" | grep -F '/var/jb/'; then
              echo "::error::Standard rootless /var/jb path detected in RootHide DEB"
              exit 1
            fi
            echo "RootHide package verified: $deb"
          done

      # Upload FIRST, so even if a simulator test fails we keep the .deb.
      - uses: actions/upload-artifact@v4
        with:
          name: carLy-deb
          path: repo/debs/*.deb
          if-no-files-found: error

      # Use an iOS 17 simulator if available; otherwise the latest iPhone.
      # The Intel test script compiles x86_64 simulator binaries, while the
      # production DEB remains arm64 + arm64e for iPhone.
      - name: Choose a simulator
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re, subprocess, sys
          devices = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          found = []
          for runtime, items in devices.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              for d in items:
                  if d["name"].startswith("iPhone"):
                      found.append(((int(m[1]), int(m[2])), d["udid"], d["name"]))
          if not found:
              sys.exit("no iPhone simulator on this runner")
          ios17 = [f for f in found if f[0][0] == 17]
          best = max(ios17 or found)
          print("simulator: iOS %d.%d, %s%s" % (best[0][0], best[0][1], best[2],
                "" if ios17 else "  (no iOS 17 runtime; results may differ from the phone)"),
                file=sys.stderr)
          print("CARLY_SIM_UDID=" + best[1])
          PY

      - name: Run both test suites
        run: scripts/test-mac.sh

      # Publish only after BOTH test suites pass, on the existing macOS runner.
      # CARLY_REPO_TOKEN must have Contents read/write access to tillman109/repo.
      - name: Check optional Sileo publishing credentials
        id: repo_auth
        env:
          REPO_TOKEN: ${{ secrets.CARLY_REPO_TOKEN }}
        run: |
          if [ -n "$REPO_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sileo publishing not configured: add CARLY_REPO_TOKEN as an Actions secret"
          fi

      - name: Checkout personal Sileo repository
        if: steps.repo_auth.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: tillman109/repo
          ref: main
          token: ${{ secrets.CARLY_REPO_TOKEN }}
          path: personal-repo

      - name: Publish carLy DEB and retain last 3 versions
        if: steps.repo_auth.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=(repo/debs/com.andi.carly_*.deb)
          if (( ${#built[@]} != 1 )); then
            echo "::error::Expected exactly one carLy DEB, found ${#built[@]}"
            exit 1
          fi

          mkdir -p personal-repo/debs
          cp -- "${built[0]}" personal-repo/debs/

          # Only delete older carLy versions. Never touch CarPlay26 or another tweak.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("personal-repo/debs")
          files = list(root.glob("com.andi.carly_*.deb"))
          rx = re.compile(r"^com\.andi\.carly_(.+)_(iphoneos-arm64|iphoneos-arm64e)\.deb$")
          found = {}
          for f in files:
              match = rx.fullmatch(f.name)
              if not match:
                  raise SystemExit("Unexpected carLy package name: " + f.name)
              found.setdefault(match.group(1), []).append(f)
          if not found:
              raise SystemExit("No carLy DEBs found after copy")
          def natural_key(value):
              return tuple((0, int(part)) if part.isdigit() else (1, part.lower())
                           for part in re.split(r"(\d+)", value))
          versions = sorted(found, key=natural_key)
          keep = set(versions[-3:])
          print("Retaining carLy versions:", ", ".join(versions[-3:]))
          for version, packages in found.items():
              if version not in keep:
                  for package in packages:
                      print("Retiring", package.name)
                      package.unlink()
          PY

          cd personal-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- debs/
          if git diff --cached --quiet; then
            echo "carLy DEB already published"
            exit 0
          fi
          git commit -m "Publish carLy development build (retain latest 3)"
          # A PAT-backed push triggers tillman109/repo's existing Pages publish.
          git push origin HEAD:main
